<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
      body {
          background-color: #172466;
          margin: 0;
          padding: 0;
          overflow-x: hidden;
          height: 100vh;
          position: relative;
      }




      /* The Moon container - handles the giant layout scale safely */
      .bottom-image {
          position: fixed;
          bottom: -30%; /* Pushes 30% of the moon below the screen */
          left: 50%;
          transform: translateX(-50%);
          display: block;
          width: 1600px;
          max-width: 180vw; /* Keeps it scalable on smaller screens */
          height: auto;
          z-index: 1;
          pointer-events: none; /* Allows clicking "through" the empty space of the image */
      }




      /* The Astronaut container - anchors safely relative to the viewport bottom */
      .astronaut {
          position: fixed;
          bottom: 15%; /* Sits safely above the moon horizon */
          left: 50%;
          transform: translateX(-50%);
          display: block;
          width: 266px;
          height: auto;
          z-index: 2;
      }




      .progress-wrapper {
          position: fixed;
          top: 80px;
          left: 20%;
          transform: translateX(-50%);
          z-index: 3;
          box-sizing: border-box;
          width: min(420px, calc(100vw - 32px));
          padding: 18px 22px;
          border-radius: 12px;
          background: rgba(23, 36, 102, 0.92);
          color: white;
          font-family: Arial, sans-serif;
      }




      .progress-wrapper2 {
          position: fixed;
          top: 80px;
          left: 40%;
          transform: translateX(-50%);
          z-index: 3;
          box-sizing: border-box;
          width: min(420px, calc(100vw - 32px));
          padding: 18px 22px;
          border-radius: 12px;
          background: rgba(23, 36, 102, 0.92);
          color: white;
          font-family: Arial, sans-serif;
      }




      .progress-wrapper3 {
          position: fixed;
          top: 80px;
          left: 60%;
          transform: translateX(-50%);
          z-index: 3;
          box-sizing: border-box;
          width: min(420px, calc(100vw - 32px));
          padding: 18px 22px;
          border-radius: 12px;
          background: rgba(23, 36, 102, 0.92);
          color: white;
          font-family: Arial, sans-serif;
      }




      .progress-wrapper4 {
          position: fixed;
          top: 80px;
          left: 80%;
          transform: translateX(-50%);
          z-index: 3;
          box-sizing: border-box;
          width: min(420px, calc(100vw - 32px));
          padding: 18px 22px;
          border-radius: 12px;
          background: rgba(23, 36, 102, 0.92);
          color: white;
          font-family: Arial, sans-serif;
      }




      .stat-info h3 {
          margin: 0 0 8px;
      }




      .stat-info p {
          margin: 0 0 10px;
      }




.progress-track {
  display: block;
  width: 28px;
  height: 180px;
  margin: 12px auto;
  writing-mode: vertical-lr;
  direction: rtl;
}




#population-progress {
  accent-color: #55d187;
}




#resource-progress {
  accent-color: #55aaff;
}




#fund-progress {
  accent-color: #B76EFF;
}




#relationship-progress {
  accent-color: #FFB347;
}




      #population-error {
          margin: 10px 0 0;
          color: #ffd1d1;
      }
      #resource-error {
          margin: 10px 0 0;
          color: #ffd1d1;
      }
      #fund-error {
          margin: 10px 0 0;
          color: #ffd1d1;
      }
      #relationship-error {
          margin: 10px 0 0;
          color: #ffd1d1;
      }


      .decision-panel {
          position: fixed;
          top: 320px;
          left: 50%;
          transform: translateX(-50%);
          z-index: 4;
          box-sizing: border-box;
          width: min(560px, calc(100vw - 32px));
          padding: 20px;
          border-radius: 12px;
          background: rgba(23, 36, 102, 0.94);
          color: white;
          font-family: Arial, sans-serif;
          text-align: center;
      }


      .decision-buttons {
          display: flex;
          justify-content: center;
          gap: 16px;
      }


      .decision-buttons button {
          min-width: 110px;
          padding: 10px 22px;
          border: 0;
          border-radius: 8px;
          font-size: 1rem;
          font-weight: bold;
          cursor: pointer;
      }


      .decision-buttons button:disabled {
          cursor: wait;
          opacity: 0.6;
      }


      #decision-message {
          min-height: 1.2em;
      }
  </style>
</head>
<body>
  <img src="/static/moon2.png" alt="Moon" class="bottom-image">
  <img src="/static/astronaut.png" alt="Astronaut" class="astronaut">
   <div class="progress-wrapper">
      <div class="stat-info">
          <h3>Population</h3>
          <p><span id="population-count">{{ pop }}</span> / 100</p>
      </div>




      <progress
          class="progress-track"
          id="population-progress"
          value="{{ pop }}"
          max="100"
          aria-label="Population out of 100"
      >{{ pop }} / 100</progress>
      <p id="stats-error" role="status" hidden>Settlement stats could not be refreshed.</p>
  </div>




  <div class="progress-wrapper2">
      <div class="stat-info">
          <h3>Resources</h3>
          <p><span id="resource-count">50</span> / 100</p>
      </div>




      <progress
          class="progress-track"
          id="resource-progress"
          value="{{ res }}"
          max="100"
          aria-label="Resources out of 100"
      >50 / 100</progress>
  </div>




  <div class="progress-wrapper3">
      <div class="stat-info">
          <h3>Funds</h3>
          <p><span id="fund-count">50</span> / 100</p>
      </div>




      <progress
          class="progress-track"
          id="fund-progress"
          value="{{ fund }}"
          max="100"
          aria-label="Funds out of 100"
      >50 / 100</progress>
  </div>




  <div class="progress-wrapper4">
      <div class="stat-info">
          <h3>Relationships</h3>
          <p><span id="relationship-count">50</span> / 100</p>
      </div>




      <progress
          class="progress-track"
          id="relationship-progress"
          value="{{ rel }}"
          max="100"
          aria-label="Relationships out of 100"
      >50 / 100</progress>
  </div>


  <section class="decision-panel" aria-live="polite">
      <h2>Colony Decision</h2>
      <p id="event-prompt">Loading next event...</p>
      <div class="decision-buttons">
          <button type="button" data-answer="yes">Yes</button>
          <button type="button" data-answer="no">No</button>
      </div>
      <p id="decision-message"></p>
      <button type="button" id="play-again" hidden>Play Again</button>


  </section>


<script>
  const decisionButtons = [...document.querySelectorAll("[data-answer]")];
  const decisionMessage = document.getElementById("decision-message");
  const statsError = document.getElementById("stats-error");
  const playAgainButton = document.getElementById("play-again");




  function setStats(state) {
      const values = [
          ["population-progress", "population-count", state.population],
          ["resource-progress", "resource-count", state.resources],
          ["fund-progress", "fund-count", state.funding],
          ["relationship-progress", "relationship-count", state.relations],
      ];
      for (const [progressId, countId, value] of values) {
          if (!Number.isFinite(value)) {
              throw new Error(`Invalid value for ${countId}.`);
          }
          document.getElementById(progressId).value = Math.max(0, Math.min(value, 100));
          document.getElementById(countId).textContent = value;
      }
   statsError.hidden = true;   }


function setGameState(state) {
   setStats(state);


   document.getElementById("event-prompt").textContent = state.game_over ? "" : state.prompt;
   decisionButtons.forEach((button) => { button.disabled = state.game_over; });
   decisionMessage.textContent = state.game_over ? state.message : (state.result || "");
   playAgainButton.hidden = !state.game_over;
   playAgainButton.disabled = false;
}




  async function loadGameState() {
      try {
          const response = await fetch("/api/state", { cache: "no-store" });
          if (!response.ok) {
              throw new Error(`Game state request failed: ${response.status}`);
          }
          setGameState(await response.json());
      } catch (error) {
          console.error("Could not refresh settlement stats.", error);
          statsError.hidden = false;
      }
  }


  async function submitAnswer(answer) {
      decisionButtons.forEach((button) => { button.disabled = true; });
      decisionMessage.textContent = "";
      try {
          const response = await fetch("/api/action", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ answer }),
          });
          const state = await response.json();
          if (!response.ok) {
              throw new Error(state.error || `Action request failed: ${response.status}`);
          }
          setGameState(state);
      } catch (error) {
          console.error("Could not submit colony decision.", error);
          decisionMessage.textContent = "Your choice could not be submitted. Please try again.";
          decisionButtons.forEach((button) => { button.disabled = false; });
          await loadGameState();
      }
  }




  async function playAgain() {
      playAgainButton.disabled = true;
      try {
          const response = await fetch("/api/reset", { method: "POST" });
          const state = await response.json();
          if (!response.ok) {
              throw new Error(state.error || `Reset request failed: ${response.status}`);
          }
          decisionMessage.textContent = "";
          setGameState(state);
      } catch (error) {
          console.error("Could not restart the game.", error);
          decisionMessage.textContent = "The game could not be restarted. Please try again.";
          playAgainButton.disabled = false;
      }
  }


  decisionButtons.forEach((button) => {
      button.addEventListener("click", () => submitAnswer(button.dataset.answer));
  });
   playAgainButton.addEventListener("click", playAgain);
  loadGameState();
</script>
</body>
</html>
