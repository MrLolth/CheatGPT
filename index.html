<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
html {
  margin: 0;
  padding: 0;
  min-height: 100vh;
  background-color: #172466;
  background-image: url("/static/background.png");
  background-size: cover;
  background-repeat: no-repeat;
  background-position: center;
}

body {
  display: flex;
  flex-direction: column; 
  align-items: center;    
  margin: 0;
  padding: 0;
  overflow-x: hidden;     
}

.moon-container {
  position: fixed;        
  bottom: 0;              
  left: 50%;              
  z-index: 1;             
  animation: giantMoonRise 10s ease-out forwards;
}

/* THE WHEEL: Houses the moon texture as a background so layers don't fight */
.moon-wheel {
  position: relative;
  width: 1000px; 
  height: 1000px;
  background-image: url("/static/moon.png");
  background-size: cover;
  background-repeat: no-repeat;
  background-position: center;
  border-radius: 50%;
  transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
  z-index: 2;
}

/* Spins the entire moon structure 180 degrees flat */
.moon-container:hover .moon-wheel {
  transform: rotate(180deg);
}

.enter-button {
  font-family: 'Orbitron', sans-serif;
  font-size: 24px;
  font-weight: bold;
  letter-spacing: 2px;
  
  color: #ffffff;
  background-color: #03001e;
  border: 3px solid #ffffff;
  box-shadow: 0 0 30px #03001e;
  
  border-radius: 50px;
  text-decoration: none;
  text-transform: uppercase;
  transition: all 0.3s ease;
  white-space: nowrap; 
  
  /* --- LAYOUT FIXES --- */
  display: inline-block; /* Forces the container to correctly respect the padding sizes */
  padding: 18px 60px;    /* Increased side padding from 45px to 60px to expand the capsule walls */
  
  position: absolute;
  left: 50%;
  transform: translateX(-50%) rotate(180deg); 
  bottom: 100px; 
}

.enter-button:hover {
  /* SWAPPED: Active on hover (Transparent background, dark text) */
  background-color: white;
  color: #03001e;
  box-shadow: 0 0 30px #ffffff;
}


@keyframes giantMoonRise {
  from {
    transform: translate(-50%, 65%); 
  }
  to {
    transform: translate(-50%, 50%); 
  }
}
</style>
</head>
<body>

<h1 style="font-family: 'Orbitron', sans-serif; font-size: 80px; color: #ffffff; text-shadow: 0 0 15px #ffffff; text-transform: uppercase; text-align: center; margin-top: 10vh;">
  <b>Moonrise Settlement</b>
</h1>

<div class="moon-container">
  <div class="moon-wheel">
    <!-- The button lives inside the moon wheel at the bottom, waiting to spin to the top -->
    <a href="/game" class="enter-button">Enter Settlement</a>
  </div>
</div>

</body>
</html>
